plugins {
    id 'com.android.application'
}

android {
    namespace 'com.re3.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.re3.android'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0-integration-shell'
        ndk {
            abiFilters 'arm64-v8a'
            version '27.0.12077973'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
        }
    }
}
